[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rethinking-supermimic"
version = "0.1.0"
description = "SuperMimic motion tracking with a differentiable world model on mjlab."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops",
    "hydra-core>=1.3.2",
    "matplotlib>=3.11.2",
    "mjlab>=1.6.0",
    "mujoco>=3.11.0,<3.12",
    "swanlab",
    "tensorboard",
    "wandb",
]

[project.optional-dependencies]
# CUDA 13 (driver >= 580): PyPI torch / Warp are CUDA 13 builds.
# uv sync --no-default-groups --extra cu13
cu13 = [
    "torch>=2.14.0",
    "torchvision",
    "warp-lang==1.18.0",
]

[dependency-groups]
# CUDA 12.6 torch + Warp +cu12 wheel. Default for older drivers.
# Requires wheels/warp_lang-1.18.0+cu12-*.whl (GitHub releases often time out).
# uv sync
cu12 = [
    "torch>=2.7.0",
    "torchvision",
    "warp-lang==1.18.0+cu12",
]

[tool.uv]
default-groups = ["cu12"]
conflicts = [
    [{ group = "cu12" }, { extra = "cu13" }],
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", group = "cu12" },
]
torchvision = [
    { index = "pytorch-cu126", group = "cu12" },
]
warp-lang = [
    { path = "wheels/warp_lang-1.18.0+cu12-py3-none-manylinux_2_28_x86_64.whl", group = "cu12" },
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
