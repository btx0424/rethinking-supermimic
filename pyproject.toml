[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rethinking-supermimic"
version = "0.2.0"
description = "G1 LAFAN tracking with explicit and latent world models."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mjlab==1.6.0",
    "mujoco==3.11.0",
    "mujoco-warp==3.11.0",
    "warp-lang==1.16.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy>=2.2,<3",
    "tensordict==0.13.0",
    "omegaconf>=2.3,<3",
    "tensorboard>=2.21,<3",
    "wandb>=0.29,<0.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
