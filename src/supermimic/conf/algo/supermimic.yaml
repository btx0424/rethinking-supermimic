# @package _global_
defaults:
  - /actor: trunk

algo: supermimic

horizon: 32
wm_window: 8
wm_batches: 10
wm_batch: 2048
pi_batch: 4096
wm_lr: 2.0e-4
pi_lr: 5.0e-4
pi_warmup: 50
v_lr: 5.0e-4
lam: 0.95
action_noise: 0.1
critic_epochs: 5
critic_minibatches: 4
policy_bootstrap: true
lr_decay_iters: 250000
wm_norm: rms
wm_residual: false
wm_frame: pelvis
# Residual actions: 0 = paper absolute action; 1.0 = head predicts a correction on
# top of the next reference joint pose (an untrained policy already tracks).
ref_residual: 0.0
# Keep gradient norms / finite checks on the GPU (no host sync inside an iteration).
no_host_sync: true
# torch.compile the analytic MDP heads (reward / FK) used in imagination.
compile_mdp: true
stochastic_actor: false
grad_clip_norm: 1.0
grad_clip_value: null
normalize_reward: true
compile: true
compile_wm: window
amp: bf16
fk: torch
adv_coef: 0.0
reward_coef: 1.0
contact_coef: 0.01
ckpt_every: 500
# Store optimizer moments in checkpoints (~80 MiB). Off keeps weights only.
save_optim: false
# Polyak EMA decay β (tau = 1-β) for eval checkpoints (null = off).
pi_ema: 0.99
wm_ema: 0.99
# Policy imagination BPTT: live | ema (ema requires wm_ema).
imagine_wm: live
resume: null
wm_ckpt: null
wm_tune: tunable
