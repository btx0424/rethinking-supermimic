# @package _global_
defaults:
  - /actor: trunk

algo: nablamimic

horizon: 32
wm_window: 8
wm_batches: 10
wm_batch: 2048
pi_batch: 4096
wm_lr: 2.0e-4
# Regression Adam LR (PODS / ∇Mimic action targets).
pi_lr: 6.0e-4
pi_warmup: 50
v_lr: 5.0e-4
lam: 0.95
action_noise: 0.1
critic_epochs: 5
critic_minibatches: 4
policy_bootstrap: true
lr_decay_iters: 250000
wm_norm: rms
wm_residual: false
wm_frame: pelvis
ref_residual: 0.0
no_host_sync: true
compile_mdp: true
stochastic_actor: false
grad_clip_norm: 1.0
# NablaMimic also clips element-wise at 0.1 on the regression Adam.
grad_clip_value: 0.1
normalize_reward: false
compile: true
compile_wm: window
amp: bf16
fk: torch
adv_coef: 0.0
reward_coef: 1.0
contact_coef: 0.01
ckpt_every: 500
# Store optimizer moments in checkpoints (~80 MiB). Off keeps weights only.
save_optim: false
pi_ema: 0.99
wm_ema: 0.99
imagine_wm: live
resume: null
wm_ckpt: null
wm_tune: tunable

# ∇Mimic / PODS policy improvement (paper Table 10 defaults).
act_cot_clip: 3.0
action_target_steps: 8
action_target_windows: 1
action_target_delta: 0.03
action_target_delta_floor: 0.3
action_target_batch: 16384
action_target_lr: 6.0e-4
