defaults:
  - task: lafan1
  - algo: supermimic
  - _self_

hydra:
  job:
    chdir: false
  run:
    dir: logs/${swanlab.experiment}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: logs/${swanlab.experiment}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

# Algorithm: set via defaults (`algo=supermimic`) or CLI (`python train.py algo=sac`).
obs:
  joint_pos: true
  joint_vel: true
  base_ang_vel: true
  base_lin_vel: false
  projected_gravity: true
  last_action: true
  anchor_ori: true
  anchor_pos: true
  body_pos: true
  body_ori: true
  # Auto-enabled for weave (has_object). Leave false for lafan1.
  object_pos: false
  object_ori: false

# Task options (robot, object, split, hand colliders) live in the `task` node:
#   python -m supermimic.train task=weave_xhand task.has_object=false
anchor: pelvis
reward_style: gaussian

num_envs: 4096
iterations: 40000
buffer_steps: 1000
utd: 0.4
gamma: 0.99
optim: muon

# Shared critic settings (SuperMimic GAE critic and SAC Q).
critic_ensemble: 2
critic_kind: scalar
critic_atoms: 51
critic_v_min: -2.0
critic_v_max: 15.0
critic_sigma_ratio: 0.75

device: cuda
log_every: 50
seed: 0

swanlab:
  project: rethinking-supermimic
  mode: online
  # Derived from the task spec: `<task>`, or `<task>_<object>[_<split>]` for object tasks,
  # with a `_noobj` suffix when the object is switched off.
  experiment: ${task_run_name:${task.name},${task.object_name},${task.split},${task.has_object},${task.simple_hands}}
